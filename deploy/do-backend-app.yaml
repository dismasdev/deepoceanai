name: brainstorm-ai-backend
region: nyc
services:
  - name: api
    environment_slug: python
    source_dir: /
    github:
      repo: YOUR_GITHUB_ORG/YOUR_REPO
      branch: main
      deploy_on_push: false
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
    build_command: pip install .
    run_command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080
    envs:
      - key: ENABLE_GRADIENT_AGENT
        value: "false"
      - key: GRADIENT_MODEL_ACCESS_KEY
        value: ""
        type: SECRET
      - key: GRADIENT_MODEL_ID
        value: openai-gpt-oss-120b
      - key: GRADIENT_INFERENCE_ENDPOINT
        value: https://inference.do-ai.run
